apiVersion: v1
kind: Service
metadata:
  name: score
  namespace: comex
spec:
  selector:
    app: score
  ports:
    - port: 8120
      targetPort: 8120
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: score
  namespace: comex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: score
  template:
    metadata:
      labels:
        app: score
    spec:
      containers:
        - name: score
          image: ${REGISTRE}/score:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8120
          envFrom:
            - secretRef:
                name: comex-base
          env:
            - name: PG_HOTE
              value: postgres
            - name: PG_PORT
              value: "5432"
            - name: PG_BASE
              value: ${BASE_SCORE}
            - name: CHEMIN_MODELE
              value: /app/models/arbre_risque.pkl
          readinessProbe:
            httpGet:
              path: /sante
              port: 8120
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /sante
              port: 8120
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: modeles
              mountPath: /app/models
      volumes:
        - name: modeles
          persistentVolumeClaim:
            claimName: registre-modeles
