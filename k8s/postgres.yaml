apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: comex
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: comex
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: entrepot
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: comex-base
                  key: PG_UTILISATEUR
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comex-base
                  key: PG_MOT_DE_PASSE
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d entrepot"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
            - name: initialisation
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initialisation
          configMap:
            name: postgres-initialisation
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
