apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: comex
spec:
  selector:
    app: web
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: comex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ${REGISTRE}/web:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3100
          envFrom:
            - secretRef:
                name: comex-base
          env:
            - name: MODE_DEMO
              value: "${MODE_DEMO}"
            - name: PG_HOTE
              value: postgres
            - name: PG_PORT
              value: "5432"
            - name: API_SCORE_URL
              value: http://score:8120
          readinessProbe:
            httpGet:
              path: /api/sante
              port: 3100
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/sante
              port: 3100
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
