global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertes.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: api-score
    static_configs:
      - targets: ["score-demo:8120"]
  - job_name: api-simulee
    static_configs:
      - targets: ["api:8110"]
