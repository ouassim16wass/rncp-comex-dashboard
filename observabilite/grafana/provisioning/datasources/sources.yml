apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Supervision
    uid: supervision
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${PG_UTILISATEUR}
    jsonData:
      database: entrepot_demo
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${PG_MOT_DE_PASSE}
