server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: conteneurs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=rncpwass"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: conteneur
    pipeline_stages:
      - json:
          expressions:
            niveau: niveau
            service: service
            evenement: evenement
      - labels:
          niveau:
          service:
  - job_name: taches_courtes
    static_configs:
      - targets: [localhost]
        labels:
          conteneur: spark
          __path__: /journaux/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            niveau: niveau
            service: service
            evenement: evenement
      - labels:
          niveau:
          service:
