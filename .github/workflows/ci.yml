name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  donnees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun fichier de données ni de configuration locale suivi
        run: |
          interdits=$(git ls-files | grep -v '^docs/memoire/Memoire_Ouassim_Megrad.docx$' | grep -Ei '\.(xlsx|xls|xlsm|csv|parquet|pkl|docx|pptx)$|^donnees_confidentielles/|^\.env$' || true)
          if [ -n "$interdits" ]; then
            echo "Fichiers interdits suivis par git :"
            echo "$interdits"
            exit 1
          fi

  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx --bun tsc --noEmit
      - run: bun test
      - run: bun --bun next build

  images:
    runs-on: ubuntu-latest
    needs: [qualite, donnees, dashboard]
    strategy:
      matrix:
        image: [api, spark, dbt, score, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
